<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yelp Review Search - Semantic Search</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1>🔍 Yelp Review Semantic Search</h1>
                <p class="subtitle">Find similar reviews using AI-powered embeddings</p>
            </div>
        </header>

        <main class="main-content">
            <!-- Search Section -->
            <section class="search-section">
                <div class="search-card">
                    <h2>Search Reviews</h2>
                    <form id="searchForm">
                        <div class="form-group">
                            <label for="queryInput">Enter search query:</label>
                            <input 
                                type="text" 
                                id="queryInput" 
                                placeholder="e.g., Great food and service, Bad experience, etc."
                                class="input-field"
                            >
                        </div>
                        <div class="form-group">
                            <label for="resultsCount">Number of results:</label>
                            <select id="resultsCount" class="input-field">
                                <option value="3">3 Results</option>
                                <option value="5" selected>5 Results</option>
                                <option value="10">10 Results</option>
                                <option value="15">15 Results</option>
                                <option value="20">20 Results</option>
                            </select>
                        </div>
                        <button type="submit" class="btn-search">Search</button>
                    </form>
                    <div id="loading" class="loading" style="display: none;">
                        <div class="spinner"></div>
                        <p>Searching...</p>
                    </div>
                </div>
            </section>

            <!-- Stats Section -->
            <section class="stats-section" id="statsSection">
                <div class="stats-card">
                    <h3>Dataset Statistics</h3>
                    <div id="statsContent" class="stats-content"></div>
                </div>
            </section>

            <!-- Results Section -->
            <section class="results-section" id="resultsSection" style="display: none;">
                <h2>Search Results</h2>
                <div id="resultsContainer" class="results-container"></div>
            </section>

            <!-- Error Section -->
            <div id="errorMessage" class="error-message" style="display: none;"></div>
        </main>

        <footer class="footer">
            <p>Powered by Sentence Transformers & FAISS • Yelp Reviews Semantic Search</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
